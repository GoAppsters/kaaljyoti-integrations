[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kaaljyoti"
version = "0.1.1"
description = "Typed Python client for the Kaal Jyoti API: kundli, panchang, dasha, transits and matching."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "GoAppsters" }]
keywords = ["astrology", "vedic", "kundli", "panchang", "jyotish", "kaaljyoti", "api", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "httpx>=0.27", "build>=1.2"]

[project.urls]
Homepage = "https://kaaljyoti.com/api/docs"
Repository = "https://github.com/goappsters/kaaljyoti-integrations"

[tool.hatch.build.targets.wheel]
packages = ["src/kaaljyoti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is not installed into the dev venv; tests import it from `src/`.
pythonpath = ["src"]
markers = ["smoke: live calls against staging, opt-in with KJ_SMOKE=1"]
# The smoke tests call staging; `pytest -m smoke` (a later `-m` wins) runs them.
addopts = '-m "not smoke"'

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
