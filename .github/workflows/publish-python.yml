# Publish the Python SDK to PyPI on an sdk-python-v* tag.
#
# Owner-gated: PyPI trusted publishing needs the project to exist on PyPI
# with this repository and workflow registered as its publisher. Until
# PYPI_PUBLISH is set to "yes" as a repository variable the publish step is
# skipped and the tag only proves the package builds.
name: publish-python

on:
  push:
    tags: ['sdk-python-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tag matches package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          [ "${GITHUB_REF_NAME}" = "sdk-python-v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != sdk-python-v${version}"; exit 1; }
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check . && mypy && pytest
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ vars.PYPI_PUBLISH == 'yes' }}
        with:
          packages-dir: packages/sdk-python/dist
